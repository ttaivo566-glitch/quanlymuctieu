<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lịch công việc</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:var(--font);color:var(--text);background:linear-gradient(var(--bg),var(--bg2)) fixed}
#decor{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#decor span{position:absolute;top:-40px;opacity:.5;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(115vh) rotate(300deg)}}
@media(prefers-reduced-motion:reduce){#decor span{animation:none;top:20%}}
header{position:relative;z-index:1;background:var(--head-bg);color:var(--on-primary);padding:14px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{margin:0;font:700 clamp(24px,4vw,38px)/1.1 var(--font-title)}
#sub{opacity:.85;font-size:14px}
button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:7px 12px}
button:hover{border-color:var(--primary)}
button.p{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#st{font-size:13px;opacity:.9}
main{position:relative;z-index:1;padding:16px}
@media(min-width:1000px){main{margin-right:340px}}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
#mt{flex:1;margin:0;font:700 22px var(--font-title);text-align:center}
#grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{text-align:center;font-weight:700;padding:8px 2px;background:var(--panel);border:var(--cell-border);border-radius:var(--radius)}
.wd i{display:none;font-style:normal}
.we{color:var(--weekend)}
.c{min-height:100px;padding:6px;background:var(--cell);border:var(--cell-border);border-radius:var(--radius);cursor:pointer;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.c:hover{background:var(--cell-hover)}
.c.off{background:var(--cell-off);opacity:.6}
.c.today{background:var(--today);box-shadow:0 0 0 2px var(--primary) inset}
.n{font-weight:700}
.ct{background:var(--task-bg);color:var(--task-text);border-radius:6px;padding:4px 6px;font-size:13px;line-height:1.25;overflow:hidden}
.ct small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.9}
.ct.dn{opacity:.5}
#notif{position:fixed;right:12px;bottom:12px;width:316px;max-height:62vh;overflow:auto;z-index:5;background:var(--panel);border:var(--cell-border);border-radius:var(--radius);box-shadow:0 6px 24px #0003}
#notif h3{margin:0;padding:10px 12px;position:sticky;top:0;background:var(--primary);color:var(--on-primary);display:flex;justify-content:space-between;align-items:center;font-size:15px}
#notif h3 button{padding:0 8px;background:transparent;color:inherit;border-color:currentColor}
#nb{padding:8px 12px}
#notif.min #nb{display:none}
.g{margin:8px 0 4px;font-weight:700;font-size:13px;color:var(--primary)}
.it{display:flex;gap:6px;padding:6px 8px;margin:3px 0;border-radius:6px;background:var(--cell-off);cursor:pointer;font-size:14px}
.it:hover{background:var(--cell-hover)}
.it em{font-style:normal;color:var(--muted);min-width:42px}
.mu{color:var(--muted);font-size:14px}
@media(max-width:999px){#notif{position:static;width:auto;max-height:none;margin:0 16px 20px;position:relative}}
@media(max-width:640px){.wd b{display:none}.wd i{display:inline}.c{min-height:72px;padding:3px}.ct{font-size:11px;padding:2px 4px}.ct small{display:none}main{padding:8px}}
.mod{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:20}
.mod.on{display:flex}
.box{background:var(--panel);width:min(540px,94vw);max-height:90vh;overflow:auto;border-radius:14px;padding:16px;border:var(--cell-border)}
.box h2{margin:0 0 10px;font:700 20px var(--font-title)}
input,textarea,select{width:100%;padding:8px;margin:4px 0;border-radius:8px;border:1px solid var(--border);background:var(--cell);color:var(--text);font:inherit}
label{font-size:13px;color:var(--muted)}
ul{list-style:none;margin:0 0 12px;padding:0}
li{display:flex;gap:8px;align-items:flex-start;padding:8px;border-bottom:1px solid var(--border)}
li input[type=checkbox]{width:auto;margin-top:5px}
li div{flex:1;min-width:0;overflow-wrap:anywhere}
li.dn b{text-decoration:line-through;opacity:.55}
li p{margin:2px 0 0;font-size:13px;color:var(--muted);white-space:pre-wrap}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
</style>
</head>
<body>
<div id="decor"></div>
<header>
  <div><h1 id="title"></h1><div id="sub"></div></div>
  <div class="tools"><span id="st"></span><button id="bs" title="Cài đặt">⚙️ Cài đặt</button></div>
</header>
<main>
  <div class="bar">
    <button id="pv" aria-label="Tháng trước">◀</button>
    <h2 id="mt"></h2>
    <button id="nx" aria-label="Tháng sau">▶</button>
    <button id="td" class="p">Hôm nay</button>
  </div>
  <div id="grid"></div>
</main>
<aside id="notif"><h3><span id="nh"></span><button id="nm" title="Thu gọn / mở rộng">—</button></h3><div id="nb"></div></aside>

<div class="mod" id="md"><div class="box">
  <h2 id="dt"></h2>
  <ul id="ls"></ul>
  <label>Tên công việc</label><input id="ft" maxlength="120" placeholder="Ví dụ: Họp giao ban">
  <label>Giờ (không bắt buộc)</label><input id="fh" type="time">
  <label>Ghi chú</label><textarea id="fn" rows="3" maxlength="600"></textarea>
  <div class="row"><button id="fc">Đóng</button><button id="fs" class="p">Thêm việc</button></div>
</div></div>

<div class="mod" id="ms"><div class="box">
  <h2>Cài đặt</h2>
  <label>Nhắc các việc trong bao nhiêu ngày tới (0 = chỉ hôm nay)</label><input id="sn" type="number" min="0" max="365">
  <label>Chủ đề giao diện</label><select id="sth"></select>
  <label>Mã đồng bộ (các máy dùng cùng mã sẽ thấy cùng dữ liệu)</label><input id="sc">
  <p class="mu" id="si"></p>
  <div class="row"><button id="sx">Đóng</button><button id="sv" class="p">Lưu mã & tải lại</button></div>
</div></div>

<script src="config.js"></script>
<script src="themes.js"></script>
<script>
const WD=['Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy','Chủ Nhật'], WS=['T2','T3','T4','T5','T6','T7','CN'];
const $=s=>document.querySelector(s), p2=n=>String(n).padStart(2,'0');
const K=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const fromK=k=>{const[a,b,c]=k.split('-');return new Date(+a,b-1,+c)};
const wi=d=>(d.getDay()+6)%7;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean=s=>String(s||'').replace(/[^A-Za-z0-9_-]/g,'').slice(0,60);
const norm=r=>({days:(r&&r.days)||{},settings:Object.assign({n:3,theme:'auto'},r&&r.settings)});

const CFG=window.CAL_CONFIG||{}, DB=(CFG.databaseURL||'').replace(/\/$/,'');
const code=clean(localStorage.getItem('cal.code')||CFG.defaultCode||'lich');
const base=()=>`${DB}/lich/${code}`, DK='cal.data.'+code, QK='cal.q.'+code;
const jp=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
let S=norm(jp(DK,null)), Q=jp(QK,[]), busy=false, online=false, cur=null, editId=null, themeId=null;
let now=new Date(), view={y:now.getFullYear(),m:now.getMonth()};
const save=()=>{localStorage.setItem(DK,JSON.stringify(S));localStorage.setItem(QK,JSON.stringify(Q))};

/* ---------- Đồng bộ (Firebase Realtime Database qua REST) ---------- */
function status(){
  $('#st').textContent=!DB?'💾 Chỉ lưu trên máy này':Q.length?`⚠️ Chưa đồng bộ (${Q.length})`:online?'☁️ Đã đồng bộ':'⚠️ Mất kết nối';
}
async function flush(){
  if(!DB||busy)return; busy=true;
  try{while(Q.length){const o=Q[0];
    const r=await fetch(base()+o.p+'.json',{method:o.m,body:o.m==='DELETE'?undefined:JSON.stringify(o.b)});
    if(!r.ok)throw 0; Q.shift(); save();}
    online=true;}catch(e){online=false}
  busy=false; status();
}
function op(m,p,b){Q.push({m,p,b});save();status();flush()}
async function poll(){
  if(!DB)return; await flush(); if(Q.length)return;
  try{const r=await fetch(base()+'.json'); if(!r.ok)throw 0; const j=await r.json(); online=true;
    if(!j){if(Object.keys(S.days).length)op('PUT','',S)}
    else{const n=norm(j); if(JSON.stringify(n)!==JSON.stringify(S)){S=n;save();renderAll()}}
  }catch(e){online=false}
  status();
}

/* ---------- Dữ liệu công việc ---------- */
const tasksOf=k=>Object.values(S.days[k]||{}).sort((a,b)=>((a.time||'99:99')+a.id).localeCompare((b.time||'99:99')+b.id));

/* ---------- Chủ đề ---------- */
function pickTheme(){
  const T=window.CAL_THEMES, id=S.settings.theme;
  if(id!=='auto')return T.find(t=>t.id===id)||T[0];
  const d=new Date(), md=p2(d.getMonth()+1)+'-'+p2(d.getDate());
  return T.find(t=>t.auto&&md>=t.auto.from&&md<=t.auto.to)||T[0];
}
function applyTheme(){
  const T=pickTheme(), st=document.documentElement.style;
  if(themeId===T.id)return; themeId=T.id;
  const all=Object.assign({},window.CAL_THEMES[0].vars,T.vars);
  for(const k in all)st.setProperty(k,all[k]);
  $('#title').textContent=`${T.icon} ${T.title}`; $('#sub').textContent=T.subtitle||'';
  let fl=$('#tf');if(!fl){fl=document.createElement('link');fl.id='tf';fl.rel='stylesheet';document.head.appendChild(fl)}
  if(T.fontUrl)fl.href=T.fontUrl;else fl.removeAttribute('href');
  document.title=T.title; window.MARK=T.mark||'📌';
  const d=$('#decor'); d.innerHTML='';
  if(T.decor)for(let i=0;i<T.decor.count;i++){
    const s=document.createElement('span'); s.textContent=T.decor.emoji[i%T.decor.emoji.length];
    s.style.cssText=`left:${Math.random()*100}%;font-size:${14+Math.random()*18}px;animation-duration:${9+Math.random()*10}s;animation-delay:-${Math.random()*14}s`;
    d.appendChild(s);
  }
}

/* ---------- Hiển thị ---------- */
function renderGrid(){
  const {y,m}=view, off=wi(new Date(y,m,1)), dim=new Date(y,m+1,0).getDate(), total=Math.ceil((off+dim)/7)*7, tk=K(new Date());
  $('#mt').textContent=`Tháng ${m+1} năm ${y}`;
  let h=WD.map((w,i)=>`<div class="wd ${i>4?'we':''}"><b>${w}</b><i>${WS[i]}</i></div>`).join('');
  for(let i=0;i<total;i++){
    const d=new Date(y,m,1-off+i), k=K(d), L=tasksOf(k), done=L.length&&L.every(t=>t.done);
    h+=`<div class="c ${d.getMonth()!==m?'off':''} ${k===tk?'today':''}" data-k="${k}"><div class="n ${wi(d)>4?'we':''}">${d.getDate()}</div>`+
      (L.length?`<div class="ct ${done?'dn':''}"><b>${done?'✔':window.MARK} ${L.length} việc</b><small>${esc(L[0].title)}</small></div>`:'')+`</div>`;
  }
  $('#grid').innerHTML=h;
}
function renderPanel(){
  const n=Math.max(0,+S.settings.n||0), t0=new Date(); let cnt=0, h='';
  for(let i=0;i<=n;i++){
    const d=new Date(t0.getFullYear(),t0.getMonth(),t0.getDate()+i), k=K(d), L=tasksOf(k).filter(t=>!t.done);
    if(!L.length)continue; cnt+=L.length;
    h+=`<div class="g">${i===0?'Hôm nay':i===1?'Ngày mai':`${WD[wi(d)]}, ${p2(d.getDate())}/${p2(d.getMonth()+1)} (còn ${i} ngày)`}</div>`+
      L.map(t=>`<div class="it" data-k="${k}"><em>${t.time||'cả ngày'}</em><span>${esc(t.title)}</span></div>`).join('');
  }
  $('#nh').textContent=`🔔 ${n===0?'Hôm nay':n+' ngày tới'}: ${cnt} việc`;
  $('#nb').innerHTML=h||'<p class="mu">Không có việc cần làm 🎉</p>';
}
function renderList(){
  const L=tasksOf(cur);
  $('#ls').innerHTML=L.length?L.map(t=>`<li class="${t.done?'dn':''}" data-id="${t.id}"><input type="checkbox" ${t.done?'checked':''} aria-label="Hoàn thành">
    <div><b>${t.time?t.time+' · ':''}${esc(t.title)}</b>${t.note?`<p>${esc(t.note)}</p>`:''}</div>
    <button data-a="e" title="Sửa">✏️</button><button data-a="x" title="Xóa">🗑️</button></li>`).join(''):'<li class="mu">Chưa có việc nào trong ngày này.</li>';
}
function renderAll(){applyTheme();renderGrid();renderPanel();if(cur)renderList()}

/* ---------- Thao tác ---------- */
function openDay(k){
  cur=k; const d=fromK(k); $('#dt').textContent=`${WD[wi(d)]}, ${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()}`;
  resetForm(); renderList(); $('#md').classList.add('on');
}
function resetForm(){editId=null;$('#ft').value=$('#fh').value=$('#fn').value='';$('#fs').textContent='Thêm việc'}
function putTask(t){(S.days[cur]=S.days[cur]||{})[t.id]=t; op('PUT',`/days/${cur}/${t.id}`,t)}
function submit(){
  const title=$('#ft').value.trim(); if(!title){$('#ft').focus();return}
  const old=editId&&S.days[cur]&&S.days[cur][editId];
  putTask({id:editId||Date.now().toString(36)+Math.random().toString(36).slice(2,6),title,time:$('#fh').value,note:$('#fn').value.trim(),done:old?old.done:false});
  resetForm(); renderAll(); $('#ft').focus();
}
$('#fs').onclick=submit;
$('#ft').onkeydown=e=>{if(e.key==='Enter')submit()};
$('#fc').onclick=()=>{$('#md').classList.remove('on');cur=null};
$('#ls').onclick=e=>{
  const li=e.target.closest('li[data-id]'); if(!li)return; const t=S.days[cur][li.dataset.id], a=e.target.dataset.a;
  if(e.target.type==='checkbox'){t.done=e.target.checked;putTask(t);renderAll()}
  else if(a==='x'){delete S.days[cur][t.id];if(!Object.keys(S.days[cur]).length)delete S.days[cur];op('DELETE',`/days/${cur}/${t.id}`);renderAll()}
  else if(a==='e'){editId=t.id;$('#ft').value=t.title;$('#fh').value=t.time||'';$('#fn').value=t.note||'';$('#fs').textContent='Lưu thay đổi';$('#ft').focus()}
};
$('#grid').onclick=e=>{const c=e.target.closest('.c');if(c)openDay(c.dataset.k)};
$('#nb').onclick=e=>{const c=e.target.closest('.it');if(c)openDay(c.dataset.k)};
$('#nm').onclick=()=>$('#notif').classList.toggle('min');
$('#pv').onclick=()=>{view.m--;if(view.m<0){view.m=11;view.y--}renderGrid()};
$('#nx').onclick=()=>{view.m++;if(view.m>11){view.m=0;view.y++}renderGrid()};
$('#td').onclick=()=>{const d=new Date();view={y:d.getFullYear(),m:d.getMonth()};renderGrid()};
document.querySelectorAll('.mod').forEach(m=>m.onmousedown=e=>{if(e.target===m){m.classList.remove('on');if(m.id==='md')cur=null}});

/* Cài đặt */
$('#sth').innerHTML='<option value="auto">Tự động theo ngày lễ</option>'+window.CAL_THEMES.map(t=>`<option value="${t.id}">${t.icon} ${t.name}</option>`).join('');
$('#bs').onclick=()=>{$('#sn').value=S.settings.n;$('#sth').value=S.settings.theme;$('#sc').value=code;
  $('#si').textContent=DB?'Dữ liệu được lưu trên đám mây theo mã đồng bộ.':'Chưa cấu hình databaseURL trong config.js nên dữ liệu chỉ lưu trên trình duyệt này.';
  $('#ms').classList.add('on')};
$('#sx').onclick=()=>$('#ms').classList.remove('on');
function setSetting(){S.settings.n=Math.max(0,Math.min(365,parseInt($('#sn').value)||0));S.settings.theme=$('#sth').value;op('PUT','/settings',S.settings);renderAll()}
$('#sn').onchange=$('#sth').onchange=setSetting;
$('#sv').onclick=()=>{const c=clean($('#sc').value);if(c&&c!==code){localStorage.setItem('cal.code',c);location.reload()}else $('#ms').classList.remove('on')};

/* Khởi động */
renderAll(); status(); poll();
setInterval(poll,15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
setInterval(()=>{const d=new Date();if(K(d)!==K(now)){now=d;themeId=null;renderAll()}},60000);
</script>
</body>
</html>
